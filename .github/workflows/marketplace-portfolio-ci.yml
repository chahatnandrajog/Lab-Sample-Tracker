name: Marketplace Inventory API Checks
on:
  push:
    paths:
      - 'portfolio/marketplace-inventory-api/**'
      - '.github/workflows/marketplace-portfolio-ci.yml'
  pull_request:
    paths:
      - 'portfolio/marketplace-inventory-api/**'
      - '.github/workflows/marketplace-portfolio-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio/marketplace-inventory-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests
